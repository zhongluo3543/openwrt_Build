name: N1 OpenWrt 25.12 Config Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-audit:
    runs-on: ubuntu-24.04

    steps:
      # 1. 安装依赖
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc

      # 2. 下载 OpenWrt 25.12 源码
      - name: Clone OpenWrt
        run: |
          git clone --depth 1 \
            --branch v25.12.6 \
            https://git.openwrt.org/openwrt/openwrt.git \
            openwrt

      # 3. 更新软件源
      - name: Update Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 4. 获取 ARMv8 官方默认配置
      - name: Download Default Config
        working-directory: openwrt
        run: |
          wget -O .config \
            https://downloads.openwrt.org/releases/25.12.6/targets/armsr/armv8/config.buildinfo

      # 5. 展开完整配置
      - name: Generate Full Config
        working-directory: openwrt
        run: |
          make defconfig

      # 6. 提取配置及所有 Kconfig 选项
      - name: Generate Config Audit
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          OUT="../config-export"
          mkdir -p "$OUT"

          # 完整配置
          cp .config "$OUT/N1-full.config"

          # 已启用
          grep -E '^CONFIG_[^=]+=' .config \
            > "$OUT/enabled.txt" || true

          # 已明确关闭
          grep -E '^# CONFIG_[^ ]+ is not set$' .config \
            > "$OUT/disabled.txt" || true

          # 提取源码中全部 Kconfig 定义
          find . \
            \( -path './.git' \
            -o -path './build_dir' \
            -o -path './staging_dir' \
            -o -path './tmp' \) -prune -o \
            -type f \( \
              -name 'Kconfig' \
              -o -name 'Kconfig.*' \
              -o -name 'Config.in' \
            \) -print0 |
          xargs -0 grep -hE \
            '^[[:space:]]*(config|menuconfig)[[:space:]]+[A-Za-z0-9_]+' \
            2>/dev/null |
          awk '{print $2}' |
          sort -u > "$OUT/all-options.txt"

          # 当前 .config 中出现的全部选项
          grep -oE '^(CONFIG_[^=]+|# CONFIG_[^ ]+)' .config |
            sed 's/^# //' |
            sort -u > "$OUT/config-present.txt"

          # 源码定义但没有出现在 .config 的选项
          sed 's/^/CONFIG_/' "$OUT/all-options.txt" |
            sort -u > /tmp/all-config-options.txt

          comm -23 \
            /tmp/all-config-options.txt \
            "$OUT/config-present.txt" \
            > "$OUT/not-in-config.txt"

          # 按类别整理当前配置中的选项
          grep '^CONFIG_TARGET_' .config \
            > "$OUT/target-options.txt" || true

          grep '^CONFIG_KERNEL_' .config \
            > "$OUT/kernel-options.txt" || true

          grep -E '^(CONFIG_PACKAGE_|# CONFIG_PACKAGE_)' .config \
            > "$OUT/package-options.txt" || true

          # 生成说明
          cat > "$OUT/README.txt" <<'EOF'
          OpenWrt 25.12 ARMv8 Config Audit

          N1 hardware support is not included automatically.
          This uses official armsr/armv8 generic configuration.

          enabled.txt:
          Explicitly enabled options.

          disabled.txt:
          Explicitly disabled options.

          all-options.txt:
          All config/menuconfig symbols found in scanned Kconfig files.

          config-present.txt:
          Symbols appearing in the generated .config.

          not-in-config.txt:
          Source symbols absent from the generated .config.
          These may be hidden, dependency-inactive, or otherwise
          not emitted by the current Kconfig configuration.

          package-options.txt:
          Package selections and disabled package symbols.

          target-options.txt:
          Target selections.

          kernel-options.txt:
          Kernel selections.

          Note:
          not-in-config.txt does NOT mean every option is directly
          selectable in menuconfig. Exact visibility and dependency
          status require evaluating the Kconfig tree.
          EOF

          # 输出统计
          echo "========== CONFIG AUDIT =========="
          echo "Enabled: $(wc -l < "$OUT/enabled.txt")"
          echo "Disabled: $(wc -l < "$OUT/disabled.txt")"
          echo "All Kconfig: $(wc -l < "$OUT/all-options.txt")"
          echo "Present: $(wc -l < "$OUT/config-present.txt")"
          echo "Not in config: $(wc -l < "$OUT/not-in-config.txt")"
          echo "=================================="

      # 7. 上传审计结果
      - name: Upload Config Audit
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-25.12-Config-Audit
          path: config-export/
          if-no-files-found: error
          retention-days: 30
