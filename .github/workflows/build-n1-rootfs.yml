name: Build N1 ARMv8 Rootfs (Lean 6.18)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Lean LEDE branch"
        required: true
        default: "master"
        type: string
      config_file:
        description: "Config file path in this repository"
        required: true
        default: "N1-LEDE-6.18-armv8.config"
        type: string
  push:
    paths:
      - "N1-LEDE-6.18-armv8.config"
      - ".github/workflows/build-n1-rootfs.yml"

permissions:
  contents: read

concurrency:
  group: n1-rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      LEDE_REPO: https://github.com/coolsnowwolf/lede
      SMALL_PACKAGE_REPO: https://github.com/zhongluo3543/small-package.git

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3-pyelftools python3-distutils rsync swig unzip \
            zlib1g-dev file wget curl ca-certificates ecj fastjar \
            java-propose-classpath libelf-dev libfuse-dev \
            device-tree-compiler qemu-utils ccache rename \
            libgmp-dev libmpc-dev libzstd-dev
          sudo timedatectl set-timezone "$TZ"

      - name: Clone Lean source and configure feeds
        run: |
          git clone --depth=1 --branch "${{ inputs.source_branch || 'master' }}" \
            "$LEDE_REPO" openwrt

          cd openwrt
          if ! grep -qE '^[[:space:]]*src-git[[:space:]]+smpackage[[:space:]]' feeds.conf.default; then
            echo "src-git smpackage $SMALL_PACKAGE_REPO" >> feeds.conf.default
          fi

      - name: Apply openwrt_Build repository customizations
        run: |
          # Keep the customization script shipped by kenzok8/openwrt_Build
          # (for example, its default LAN address adjustment).
          if [[ -f ./customize.sh ]]; then
            chmod +x ./customize.sh
            ./customize.sh
          fi

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply small-package DIY files
        working-directory: openwrt
        shell: bash
        run: |
          DIY="feeds/smpackage/.github/diy"

          # Optional default settings and banner supplied by zhongluo3543/small-package.
          if [[ -f "$DIY/zzz-default-settings" ]]; then
            mkdir -p package/default-settings/files
            cp -f "$DIY/zzz-default-settings" \
              package/default-settings/files/zzz-default-settings
          fi

          if [[ -f "$DIY/banner" ]]; then
            mkdir -p package/base-files/files/etc
            cp -f "$DIY/banner" package/base-files/files/etc/banner
          fi

          if [[ -f "$DIY/10_system.js" ]]; then
            mkdir -p feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include
            cp -f "$DIY/10_system.js" \
              feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include/10_system.js
          fi

          # Apply the optional dnsmasq patch only when it cleanly applies to this Lean revision.
          PATCH="$DIY/patches/001-dnsmasq-lxc-jail.patch"
          if [[ -f "$PATCH" ]] && patch --dry-run --forward -p1 < "$PATCH" >/dev/null 2>&1; then
            patch --forward -p1 < "$PATCH"
          else
            echo "Skip optional dnsmasq patch (missing or does not match this source revision)."
          fi

      - name: Load N1 generic ARMv8 rootfs config
        working-directory: openwrt
        env:
          CONFIG_FILE: ${{ inputs.config_file || 'N1-LEDE-6.18-armv8.config' }}
        run: |
          SOURCE_CONFIG="$GITHUB_WORKSPACE/$CONFIG_FILE"
          test -s "$SOURCE_CONFIG" || {
            echo "::error::Config file not found: $SOURCE_CONFIG"
            exit 1
          }

          cp "$SOURCE_CONFIG" .config
          make defconfig

          grep -q '^CONFIG_TARGET_armsr=y$' .config
          grep -q '^CONFIG_TARGET_armsr_armv8=y$' .config
          grep -q '^CONFIG_LINUX_6_18=y$' .config
          grep -q '^CONFIG_TARGET_ROOTFS_TARGZ=y$' .config

          echo "Validated: armsr/armv8, Linux 6.18, rootfs TAR.GZ"

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -delete

      - name: Build packages and rootfs only
        working-directory: openwrt
        run: |
          # Build the selected packages and install them into the generic ARMv8 rootfs.
          # No Ophub/Amlogic image packaging, U-Boot installation, or USB/eMMC image creation here.
          make -j"$(nproc)" package/install target/install V=s

      - name: Collect rootfs and build metadata
        id: collect
        working-directory: openwrt
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          mapfile -t ROOTFS_FILES < <(
            find bin/targets/armsr/armv8 -maxdepth 1 -type f \
              \( -name '*rootfs.tar.gz' -o -name '*rootfs.tar.zst' -o -name '*rootfs.tar.xz' \) \
              | sort
          )

          if [[ ${#ROOTFS_FILES[@]} -eq 0 ]]; then
            echo "::error::No ARMv8 rootfs archive was produced."
            echo "Contents of bin/targets:"
            find bin/targets -maxdepth 4 -type f | sort || true
            exit 1
          fi

          for file in "${ROOTFS_FILES[@]}"; do
            cp -v "$file" "$GITHUB_WORKSPACE/output/"
          done

          cp .config "$GITHUB_WORKSPACE/output/N1-LEDE-6.18-armv8.config"
          find build_dir/target-*/linux-* -path '*/linux-*/.config' -type f \
            -exec cp -v {} "$GITHUB_WORKSPACE/output/kernel.config" \; 2>/dev/null || true

          {
            echo "Source: $LEDE_REPO"
            echo "Branch: ${{ inputs.source_branch || 'master' }}"
            echo "Device rootfs target: armsr/armv8/generic"
            echo "Kernel selection: Linux 6.18"
            echo "Rootfs format: TAR archive"
            echo "Built at: $(date -Is)"
            echo
            sha256sum "$GITHUB_WORKSPACE"/output/*rootfs*
          } > "$GITHUB_WORKSPACE/output/BUILD-INFO.txt"

          echo "Rootfs archive(s):"
          ls -lh "$GITHUB_WORKSPACE"/output/*rootfs*

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: N1-LEDE-6.18-ARMv8-rootfs-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Show disk usage
        if: always()
        run: df -hT
