
#=================================================
# Description: Build ImmortalWrt for Phicomm N1
# License: MIT
# Author: kenzo
#=================================================

name: N1-ImmortalWrt_packit

permissions:
  contents: write

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'ssh'
        required: false
        default: 'false'

env:
  UPLOAD_BIN_DIR: false
  UPLOAD_COWTRANSFER: false
  UPLOAD_FIRMWARE: true
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true

  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
  REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
  DOCKER_ID: ${{ secrets.DOCKER_ID }}
  DOCKER_PASSWD: ${{ secrets.DOCKER_PASSWD }}

  TZ: Asia/Shanghai

jobs:
  merge:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id

    name: Build ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target: [N1-ImmortalWrt]

    steps:

    #=================================================
    # Checkout
    #=================================================

    - name: Checkout
      uses: actions/checkout@main

    #=================================================
    # Free disk space
    #=================================================

    - name: Free disk space
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    #=================================================
    # Python
    #=================================================

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: 3.12

    #=================================================
    # Initialization environment
    #=================================================

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update

        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget \
          llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
          libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        sudo timedatectl set-timezone "Asia/Shanghai"

    #=================================================
    # Get current date
    #=================================================

    - name: Get current date
      id: date
      run: |
        echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
        echo "date2=$(date +'%Y/%m %d')" >> $GITHUB_ENV
        echo "date3=$(date +'%m.%d')" >> $GITHUB_ENV

        echo "DOCKERTAG=${{ secrets.DOCKER_ID }}/openwrt-6p:latest" >> $GITHUB_ENV

        VERSION="$(echo "${{ github.event.action }}" | grep -Eo " [0-9.]+" | sed -e 's/ //')" || true

        if [ -n "$VERSION" ]; then
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        else
          echo "VERSION=$(date +'%m.%d')" >> $GITHUB_ENV
        fi

    #=================================================
    # Clone source code
    #=================================================

    - name: Clone source code
      env:
        REPO_URL: https://github.com/immortalwrt/immortalwrt
        REPO_BRANCH: openwrt-25.12
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

        cd openwrt

        sed -i '$a src-git smpackage https://github.com/zhongluo3543/small-package' feeds.conf.default

    #=================================================
    # Free up disk space
    #=================================================

    - name: Free up disk space
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt/dl \
          /mnt/openwrt/staging_dir \
          /mnt/openwrt/build_dir

        ln -sf /mnt/openwrt/dl openwrt/dl
        ln -sf /mnt/openwrt/staging_dir openwrt/staging_dir
        ln -sf /mnt/openwrt/build_dir openwrt/build_dir

    #=================================================
    # Update feeds
    #=================================================

    - name: Update feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a

    #=================================================
    # Defconfig
    #=================================================

    - name: Defconfig ${{ matrix.target }}
      env:
        CONFIG_FILE: '${{ matrix.target }}.config'
      run: |
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config

        chmod +x ../customize.sh
        bash ../customize.sh

        cd openwrt

        rm -rf feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd-alt,miniupnpd-iptables,wireless-regdb,nginx,luci-lib-ipkg}

        rm -rf feeds/packages/lang/golang
        git clone https://github.com/kenzok8/golang -b 1.27 feeds/packages/lang/golang

        rm -rf feeds/packages/net/{alist,adguardhome,brook,chinadns-ng,dns2socks,dns2tcp,hysteria,ipt2socks}
        rm -rf feeds/packages/net/{lua-neturl,microsocks,naiveproxy,pdnsd-alt,redsocks2,simple-obfs,sing-box,ssocks,tcping,tuic-client}
        rm -rf feeds/packages/net/{gost,mosdns,redsocks*,smartdns,trojan*,v2ray*,xray*}

        cp -f feeds/smpackage/.github/diy/default-settings \
          package/emortal/default-settings/files/99-default-settings || true

        cp -f feeds/smpackage/.github/diy/banner \
          package/emortal/default-settings/files/openwrt_banner || true

        cp -f feeds/smpackage/.github/diy/banner \
          package/base-files/files/etc/banner

        cp -f feeds/smpackage/.github/diy/index_x86.htm \
          package/emortal/autocore/files/generic/index.htm || true

        sed -i "s/%D %V, %C/openwrt $(date +'%m.%d') by kenzo/g" \
          package/base-files/files/etc/banner

        ./scripts/feeds update -a
        ./scripts/feeds install -a

        patch -p1 < feeds/smpackage/.github/diy/patches/001-dnsmasq-lxc-jail.patch

        cp -f feeds/smpackage/.github/diy/10_system.js \
          feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include/10_system.js || true

        cp -f feeds/smpackage/.github/diy/${{ matrix.target }}.config .config

        make defconfig

    #=================================================
    # Package hash compatibility hotfix
    #=================================================

    - name: Package hash compatibility hotfix
      working-directory: ./openwrt
      run: |
        [ -f package/network/utils/fullconenat-nft/Makefile ] && \
          sed -i -E 's/^PKG_MIRROR_HASH:=.*/PKG_MIRROR_HASH:=skip/' \
          package/network/utils/fullconenat-nft/Makefile || true

    #=================================================
    # Disable Rust CI LLVM download
    #=================================================

    - name: Disable Rust CI LLVM download
      working-directory: ./openwrt
      run: |
        sed -i 's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' \
          feeds/packages/lang/rust/Makefile

        grep -q -- '--set=llvm.download-ci-llvm=false' \
          feeds/packages/lang/rust/Makefile

    #=================================================
    # Download package
    #=================================================

    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    #=================================================
    # Cache
    #=================================================

    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt

    #=================================================
    # Compile firmware
    #=================================================

    - name: Compile the firmware
      working-directory: ./openwrt
      run: |
        export GOROOT_BOOTSTRAP=$GOROOT_BOOTSTRAP

        echo -e "$(($(nproc)+1)) thread compile"

        make -j$(($(nproc)+1)) || make -j1 V=s

    #=================================================
    # Package N1 kernel and firmware
    #=================================================

    - name: Package N1 firmware
      id: packit
      uses: unifreq/openwrt_packit@master
      continue-on-error: true
      env:
        WHOAMI: deng

        # ImmortalWrt rootfs
        # OPENWRT_ARMVIRT is supported as a legacy alias
        OPENWRT_ARMVIRT: openwrt/bin/targets/*/*/*rootfs.tar.gz

        # N1 / S905D
        PACKAGE_SOC: s905d

        # Kernel
        KERNEL_AUTO_LATEST: true
        KERNEL_VERSION_NAME: 6.18.y

        # Kernel repository
        # KERNEL_REPO_URL: ophub/kernel

        # Match LAN IP
        OPENWRT_IP: 192.168.3.1

        # Keep original rootfs.tar.gz in output
        SAVE_OPENWRT_ROOTFS: true

    #=================================================
    # Check and normalize IMG compression
    #=================================================

    - name: Check IMG compression
      if: always() && !cancelled()
      shell: bash
      run: |
        OUT="${PACKAGED_OUTPUTPATH:-/opt/openwrt_packit/output}"

        if [ ! -d "$OUT" ]; then
          echo "::warning::打包输出目录不存在，跳过 IMG 检查"
          exit 0
        fi

        find "$OUT" -type f -name '*.img.gz' -print0 |
        while IFS= read -r -d '' gz; do

          img="${gz%.gz}"

          echo "检查压缩文件: $gz"

          if gzip -t "$gz"; then
            echo "压缩成功，仅保留 IMG.GZ"
            rm -f "$img"
          else
            echo "::warning::IMG.GZ 检查失败"

            rm -f "$gz"

            if [ -f "$img" ]; then
              echo "保留原始 IMG: $img"
            else
              echo "::error::压缩文件损坏且原始 IMG 不存在: $img"
            fi
          fi

        done

        echo "IMG 压缩检查完成"

    #=================================================
    # Check space usage
    #=================================================

    - name: Check space usage
      if: always() && !cancelled()
      run: |
        df -hT

    #=================================================
    # Upload bin directory
    #=================================================

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: success() && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    #=================================================
    # Organize files
    #=================================================

    - name: Organize files
      id: organize
      if: always() && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      shell: bash
      run: |
        mkdir -p firmware

        # 1. 保留原始 rootfs.tar.gz
        find openwrt/bin/targets -type f -name '*rootfs.tar.gz' \
          -exec cp -av {} firmware/ \; 2>/dev/null || true

        # 2. 复制打包后的全部文件
        OUT="${PACKAGED_OUTPUTPATH:-/opt/openwrt_packit/output}"

        if [ -d "$OUT" ]; then
          cp -av "$OUT"/. firmware/
        else
          echo "::warning::没有找到打包输出目录"
        fi

        # 3. 保存 OpenWrt 配置
        cp openwrt/.config \
          firmware/${{ matrix.target }}.config 2>/dev/null || true

        # 4. 保存内核配置
        find openwrt/build_dir/target-* \
          -path '*/linux-*/linux-*/.config' \
          -type f -exec cp -f {} firmware/${{ matrix.target }}_kernel.config \; \
          2>/dev/null || true

        # 5. 生成版本信息
        cd firmware

        echo "v${{ env.date2 }}" > version.txt

        md5sum_output="$(find . -maxdepth 1 -type f \
          ! -name 'version.txt' -print0 | \
          sort -z | xargs -0 -r md5sum)" || true

        echo "$md5sum_output" >> version.txt
        echo "${{ matrix.target }}" >> version.txt

        rm -f sha256sums

        # 6. 导出上传目录
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

        echo "固件整理完成："
        ls -lh

    #=================================================
    # Upload firmware directory
    #=================================================

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.date3 }}_${{ matrix.target }}
        path: ${{ env.FIRMWARE }}

    #=================================================
    # Upload firmware to WeTransfer
    #=================================================

    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh

        ./transfer wet -s -p 16 --no-progress \
          ${FIRMWARE} 2>&1 | tee wetransfer.log

        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"

        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    #=================================================
    # Generate release tag
    #=================================================

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "status=success" >> $GITHUB_OUTPUT

    #=================================================
    # Upload firmware to release
    #=================================================

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: "${{ env.FIRMWARE }}/*"
        name: ${{ env.date2 }} ${{ matrix.target }}
        tag_name: ${{ env.date }}_${{ matrix.target }}
        body_path: release.txt

    #=================================================
    # Delete workflow runs
    #=================================================

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 0
